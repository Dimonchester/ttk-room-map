openapi: 3.0.3
info:
  title: Карта пространства — API
  version: 1.0.0
  description: |
    Контракт между фронтендом (Vue) и бэкендом (Go).
    Правила, общие для всех эндпоинтов:
    - JSON в camelCase, даты в ISO-8601 (UTC).
    - Координаты в системе плана: float, начало в левом верхнем углу, единицы плана (не пиксели экрана).
    - Углы в градусах. yaw: 0..360 по часовой, pitch: -90..90 (вверх положительный).
    - ID сущностей внутри карты (floors, rooms, paths, pois, panoramas, hotspots) генерирует ФРОНТ (UUID v4).
      Сервер хранит их как есть. Поэтому PUT идемпотентен и временных id нет.
    - Карта сохраняется ЦЕЛИКОМ одним PUT (документ лежит в JSONB). Мелких эндпоинтов на каждую комнату/точку нет.
    - Ошибки только в формате application/problem+json (схема Problem) со стабильным полем `code`.
    - Dev и prod работают через same-origin прокси `/api`, CORS не нужен.
servers:
  - url: /api
tags:
  - name: auth
  - name: maps
  - name: media
  - name: public

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация организатора
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Создан. В ответе access-токен, refresh кладётся в httpOnly-cookie `refresh_token` (Path=/api/auth, SameSite=Lax).
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Успешный вход. Refresh в httpOnly-cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Обновить access-токен по refresh-cookie (ротация refresh)
      security: []
      responses:
        "200":
          description: Новый access-токен и пользователь (фронт вызывает при старте приложения и при 401).
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Problem" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Выход (инвалидирует refresh, чистит cookie)
      security: []
      responses:
        "204": { description: Готово }

  /maps:
    get:
      tags: [maps]
      operationId: listMaps
      summary: Карты текущего организатора
      responses:
        "200":
          description: Список (новые сверху)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MapSummary" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [maps]
      operationId: createMap
      summary: Создать пустую карту (с одним пустым этажом)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapCreate" }
      responses:
        "201":
          description: Создана
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapDoc" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /maps/{mapId}:
    parameters:
      - $ref: "#/components/parameters/MapId"
    get:
      tags: [maps]
      operationId: getMap
      summary: Документ карты (для редактора)
      responses:
        "200":
          description: Документ
          headers:
            ETag:
              schema: { type: string }
              description: 'Равен version в кавычках, например "7"'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapDoc" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [maps]
      operationId: updateMap
      summary: Сохранить документ целиком (оптимистичная блокировка)
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
          description: 'Версия документа в кавычках, например "7"'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapDoc" }
      responses:
        "200":
          description: Сохранено. В ответе актуальный документ (с новой version и медиа-полями).
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapDoc" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [maps]
      operationId: deleteMap
      summary: Удалить карту (вместе с файлами)
      responses:
        "204": { description: Удалена }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /maps/{mapId}/publish:
    parameters:
      - $ref: "#/components/parameters/MapId"
    post:
      tags: [maps]
      operationId: publishMap
      summary: Опубликовать или поменять режим доступа
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "200":
          description: Опубликовано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /maps/{mapId}/unpublish:
    parameters:
      - $ref: "#/components/parameters/MapId"
    post:
      tags: [maps]
      operationId: unpublishMap
      summary: Снять с публикации (slug сохраняется за картой)
      responses:
        "204": { description: Снята }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /maps/{mapId}/plan-image:
    parameters:
      - $ref: "#/components/parameters/MapId"
    post:
      tags: [media]
      operationId: uploadPlanImage
      summary: Загрузить фоновое изображение плана
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Загружено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanImage" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /maps/{mapId}/panoramas:
    parameters:
      - $ref: "#/components/parameters/MapId"
    post:
      tags: [media]
      operationId: uploadPanorama
      summary: Загрузить готовую equirectangular-панораму
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [panoramaId, file]
              properties:
                panoramaId: { $ref: "#/components/schemas/ID" }
                file: { type: string, format: binary }
      responses:
        "202":
          description: Принято в обработку
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanoramaMedia" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /maps/{mapId}/panorama-jobs:
    parameters:
      - $ref: "#/components/parameters/MapId"
    post:
      tags: [media]
      operationId: createPanoramaJob
      summary: Сшить панораму из серии кадров телефона
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [panoramaId, meta, frames]
              properties:
                panoramaId: { $ref: "#/components/schemas/ID" }
                meta: { type: string }
                frames:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "202":
          description: Задача принята
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanoramaMedia" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /panoramas/{panoramaId}:
    parameters:
      - name: panoramaId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
    get:
      tags: [media]
      operationId: getPanoramaStatus
      summary: Статус обработки панорамы
      responses:
        "200":
          description: Текущее состояние
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanoramaMedia" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /public/maps/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [public]
      operationId: getPublicMap
      summary: Публичная карта для посетителя и embed
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Документ карты
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapDoc" }
        "304": { description: Не изменилась }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /public/maps/{slug}/unlock:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      tags: [public]
      operationId: unlockPublicMap
      summary: Ввести пароль карты
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "204":
          description: Пароль верный
          headers:
            Set-Cookie:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MapId:
      name: mapId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{6,32}$"

  responses:
    Problem:
      description: Ошибка (application/problem+json)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Слишком много запросов
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    ID:
      type: string
      format: uuid

    Pt:
      type: array
      items: { type: number, format: double }
      minItems: 2
      maxItems: 2

    Problem:
      type: object
      required: [title, status, code]
      properties:
        type: { type: string, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        currentVersion: { type: integer, format: int64 }
        fields:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }

    User:
      type: object
      required: [id, email]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        email: { type: string, format: email }

    AuthResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer }
        user: { $ref: "#/components/schemas/User" }

    MapCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }

    MapSummary:
      type: object
      required: [id, title, isPublished, version, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        title: { type: string }
        isPublished: { type: boolean }
        slug: { type: string, nullable: true }
        version: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
        thumbnailUrl: { type: string, nullable: true }

    MapDoc:
      type: object
      required: [id, title, floors, panoramas, version]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        title: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, nullable: true, readOnly: true }
        isPublished: { type: boolean, readOnly: true }
        access:
          type: string
          enum: [public, password]
          readOnly: true
        version:
          type: integer
          format: int64
          readOnly: true
        updatedAt: { type: string, format: date-time, readOnly: true }
        floors:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/Floor" }
        panoramas:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/Panorama" }

    Floor:
      type: object
      required: [id, name, plan, rooms, paths, pois]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string, maxLength: 60 }
        plan: { $ref: "#/components/schemas/Plan" }
        rooms:
          type: array
          items: { $ref: "#/components/schemas/Room" }
        paths:
          type: array
          items: { $ref: "#/components/schemas/Path" }
        pois:
          type: array
          items: { $ref: "#/components/schemas/Poi" }

    Plan:
      type: object
      required: [width, height]
      properties:
        width: { type: number, format: double, minimum: 0 }
        height: { type: number, format: double, minimum: 0 }
        imageUrl: { type: string, nullable: true }
        imageOpacity:
          { type: number, format: double, minimum: 0, maximum: 1, default: 1 }

    Room:
      type: object
      required: [id, polygon]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string, maxLength: 120 }
        polygon:
          type: array
          minItems: 3
          maxItems: 500
          items: { $ref: "#/components/schemas/Pt" }

    Path:
      type: object
      required: [id, points, width]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        points:
          type: array
          minItems: 2
          maxItems: 500
          items: { $ref: "#/components/schemas/Pt" }
        width: { type: number, format: double, minimum: 0 }

    Poi:
      type: object
      required: [id, title, category, x, y]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        title: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, maxLength: 40 }
        description: { type: string, maxLength: 5000 }
        x: { type: number, format: double }
        y: { type: number, format: double }

    Panorama:
      type: object
      required: [id, floorId, x, y, north, hotspots]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        floorId: { $ref: "#/components/schemas/ID" }
        title: { type: string, maxLength: 120 }
        x: { type: number, format: double }
        y: { type: number, format: double }
        north: { type: number, format: double, minimum: 0, maximum: 360 }
        hotspots:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Hotspot" }
        status:
          { type: string, enum: [processing, ready, failed], readOnly: true }
        previewUrl: { type: string, nullable: true, readOnly: true }
        fullUrl: { type: string, nullable: true, readOnly: true }
        width: { type: integer, readOnly: true }
        height: { type: integer, readOnly: true }

    Hotspot:
      type: object
      required: [id, kind, yaw, pitch]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        kind: { type: string, enum: [poi, link] }
        yaw: { type: number, format: double, minimum: 0, maximum: 360 }
        pitch: { type: number, format: double, minimum: -90, maximum: 90 }
        poiId: { $ref: "#/components/schemas/ID" }
        targetPanoramaId: { $ref: "#/components/schemas/ID" }

    PublishRequest:
      type: object
      required: [access]
      properties:
        access: { type: string, enum: [public, password] }
        password: { type: string, minLength: 4, maxLength: 128 }

    PublishResponse:
      type: object
      required: [slug, url, access]
      properties:
        slug: { type: string }
        url: { type: string }
        access: { type: string, enum: [public, password] }

    PlanImage:
      type: object
      required: [imageUrl, width, height]
      properties:
        imageUrl: { type: string }
        width: { type: integer }
        height: { type: integer }

    PanoramaMedia:
      type: object
      required: [panoramaId, status]
      properties:
        panoramaId: { $ref: "#/components/schemas/ID" }
        status: { type: string, enum: [processing, ready, failed] }
        previewUrl: { type: string, nullable: true }
        fullUrl: { type: string, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        error: { type: string, nullable: true }
